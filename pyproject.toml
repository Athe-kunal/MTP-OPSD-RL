[project]
name = "mtp-opsd-rl"
version = "0.1.0"
description = "Soft-KL (KL gradient-recovery trick) for OPSD and GRPO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["torch"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtp_opsd_rl"]
